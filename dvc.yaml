stages:
  collect:
    cmd: python -X utf8 -m src.collect
    deps:
      - src/collect.py
      - src/config.py
      - pyproject.toml
      - uv.lock
    params:
      - collect
      - paths.raw
      - paths.metrics_collect
    outs:
      - data/raw.jsonl
    metrics:
      - metrics/collect.json:
          cache: true

  clean:
    cmd: python -X utf8 -m src.clean
    deps:
      - data/raw.jsonl
      - src/clean.py
      - src/dedup.py
      - src/pii.py
      - src/schema.py
      - src/stats.py
      - src/textnorm.py
      - src/config.py
    params:
      - clean
      - collect.version
      - paths.raw
      - paths.clean
      - paths.metrics_clean
    outs:
      - data/clean.jsonl
    metrics:
      - metrics/clean.json:
          cache: true

  diversity:
    cmd: python -X utf8 -m src.diversity
    deps:
      - data/clean.jsonl
      - src/diversity.py
      - src/stats.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - diversity
      - collect.version
      - split.group_key
      - paths.clean
      - paths.metrics_diversity
    metrics:
      - metrics/diversity.json:
          cache: true

  split:
    cmd: python -X utf8 -m src.split
    deps:
      - data/clean.jsonl
      - metrics/diversity.json
      - src/split.py
      - src/contamination.py
      - src/dedup.py
      - src/schema.py
      - src/textnorm.py
      - src/config.py
    params:
      - split
      - contamination
      - clean.near_dup
      - collect.version
      - paths.train
      - paths.val
      - paths.test
      - paths.metrics_split
    outs:
      - data/train.jsonl
      - data/val.jsonl
      - data/test.jsonl
    metrics:
      - metrics/split.json:
          cache: true

  tokenize:
    cmd: python -X utf8 -m src.tokenize_data
    deps:
      - data/train.jsonl
      - data/val.jsonl
      - src/tokenize_data.py
      - src/prompt.py
      - src/collate.py
      - src/pack.py
      - src/config.py
    params:
      - model
      - data.train_jsonl
      - data.val_jsonl
      - data.out_dir
      - tokenize
      - packing
      - train_estimate
    outs:
      - data/tokenized
      - docs/tokenize_report.md:
          cache: false
    metrics:
      - metrics/tokenize.json:
          cache: true

  train_all:
    cmd: python -u -X utf8 -m src.train --variant all_layers
    deps:
      - data/tokenized/train.pt
      - data/tokenized/val.pt
      - src/train.py
      - src/data.py
      - src/runtime.py
      - src/config.py
      - pyproject.toml
      - uv.lock
    params: [model, data, lora, train, variants]
    outs:
      - models/adapter_all_layers
    metrics:
      - metrics/train_all_layers.json:
          cache: true

  train_freeze:
    cmd: python -u -X utf8 -m src.train --variant freeze14
    deps:
      - data/tokenized/train.pt
      - data/tokenized/val.pt
      - src/train.py
      - src/data.py
      - src/runtime.py
      - src/config.py
      - pyproject.toml
      - uv.lock
    params: [model, data, lora, train, variants]
    outs:
      - models/adapter_freeze14
    metrics:
      - metrics/train_freeze14.json:
          cache: true

  plot:
    cmd: python -X utf8 -m src.plot
    deps:
      - metrics/train_all_layers.json
      - metrics/train_freeze14.json
      - src/plot.py
      - src/config.py
    params: [paths.curves]
    outs:
      - docs/curves.png:
          cache: false

  compare:
    cmd: python -X utf8 -m src.compare --variant all_layers
    deps:
      - models/adapter_all_layers
      - src/compare.py
      - src/prompt.py
      - src/runtime.py
      - src/config.py
    params: [model, compare, train.cpu_threads, train.deterministic, train.seed]
    outs:
      - docs/compare.md:
          cache: false
      # Generated answers are a text artifact, not numeric DVC metrics.
      - metrics/compare_all_layers.json
