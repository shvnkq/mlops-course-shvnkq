groups:
  - name: inference
    rules:
      - alert: FirstChunkSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(hw11_ttfc_seconds_bucket[24s]))) > 0.85
          and sum(increase(hw11_ttfc_seconds_count[24s])) >= 20
        for: 12s
        labels: {severity: warning}
        annotations:
          summary: "TTFC p95 exceeds 0.85 s (>=20 successful samples / 24 s)"
      - alert: RequestFailures
        expr: |
          sum(rate(hw11_requests_total{outcome!="ok"}[24s]))
          / sum(rate(hw11_requests_total[24s])) > 0.10
          and sum(increase(hw11_requests_total[24s])) >= 20
        for: 12s
        labels: {severity: warning}
        annotations:
          summary: "Failures exceed 10% (>=20 terminal outcomes / 24 s)"
